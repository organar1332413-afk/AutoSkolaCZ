name: Import remaining sign graphics

on:
  push:
    branches: [stage4-learning-content]
    paths:
      - '.github/workflows/import-sign-graphics.yml'
      - 'tools/learning_content/import_public_file_graphics.py'
      - 'tools/learning_content/test_signs.py'

permissions:
  contents: write

concurrency:
  group: sign-graphics-import-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage4-learning-content
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check pillow lxml

      - name: Import remaining official sign graphics
        run: |
          set -o pipefail
          python -m tools.learning_content.import_public_file_graphics --apply | tee /tmp/sign-import-report.txt
          python -m tools.learning_content.signs --check
          python -m unittest tools.learning_content.test_signs -v
          python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path("content/learning/signs/audit.json").read_text())
          print("graphicsPresent=", audit["graphicsPresent"])
          print("graphicsMissing=", audit["graphicsMissing"])
          print("bundledImages=", audit["bundledImages"])
          print("graphicLicenseVerified=", audit["graphicLicenseVerified"])
          print("remaining=", audit["graphicsMissingCodes"])
          PY

      - name: Commit generated graphics checkpoint
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "No importable official graphics remained."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/learning/signs/catalog.json \
                  content/learning/signs/audit.json \
                  content/learning/signs/sources.json \
                  content/learning/signs/graphics-public-file-import-report.json \
                  content/learning/signs/graphics
          git commit -m "Import remaining official sign graphics"
          git push origin HEAD:stage4-learning-content
