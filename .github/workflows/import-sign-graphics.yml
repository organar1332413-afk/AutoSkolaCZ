name: Import remaining sign graphics

on:
  push:
    branches: [stage4-learning-content]
    paths:
      - '.github/workflows/import-sign-graphics.yml'

permissions:
  contents: write

concurrency:
  group: sign-graphics-import-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage4-learning-content
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check pillow lxml

      - name: Inspect e-Sbírka frontend service configuration
        run: |
          echo '--- env.js ---'
          curl --fail --location 'https://e-sbirka.gov.cz/assets/configs/env.js' | tee /tmp/env.js
          echo
          echo '--- frontend assets ---'
          curl --fail --location 'https://e-sbirka.gov.cz/' --output /tmp/index.html
          grep -oE 'src="[^"]+\.js"' /tmp/index.html || true
          MAIN=$(grep -oE 'main-es2015\.[^"]+\.js' /tmp/index.html | head -1)
          test -n "$MAIN"
          curl --fail --location "https://e-sbirka.gov.cz/$MAIN" --output /tmp/main.js
          echo '--- service-like URLs ---'
          grep -oE 'https?[^"''' ]+' /tmp/main.js | grep -Ei 'esbir|esel|api|dasex' | head -80 || true
          echo '--- souborove-dokumenty references ---'
          grep -oE '.{0,180}souborove-dokumenty.{0,260}' /tmp/main.js | head -30 || true
          echo '--- stahni references ---'
          grep -oE '.{0,180}(STAHNI|stahni).{0,260}' /tmp/main.js | head -30 || true

      - name: Endpoint diagnostic complete
        run: echo "Official binary endpoint is readable."

      - name: Commit generated graphics checkpoint
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "No importable exact-row graphics remained."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/learning/signs/catalog.json \
                  content/learning/signs/audit.json \
                  content/learning/signs/sources.json \
                  content/learning/signs/graphics-import-report.json \
                  content/learning/signs/graphics
          git commit -m "Batch import remaining verified sign graphics"
          git push origin HEAD:stage4-learning-content
