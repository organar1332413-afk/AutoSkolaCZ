name: Import remaining sign graphics

on:
  push:
    branches: [stage4-learning-content]
    paths:
      - '.github/workflows/import-sign-graphics.yml'

permissions:
  contents: write

concurrency:
  group: sign-graphics-import-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage4-learning-content
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check pillow lxml

      - name: Test official e-Sbírka binary endpoint
        run: |
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 120 \
            'https://e-sbirka.gov.cz/esel-esbir-dasex/souborove-dokumenty/872679/ORIGINAL/STAHNI/sbcr2015c122z0294p005o067.tif' \
            --output /tmp/test-sign.tif
          file /tmp/test-sign.tif
          stat -c '%s bytes' /tmp/test-sign.tif
          sha256sum /tmp/test-sign.tif
          python - <<'PY'
          from PIL import Image
          p='/tmp/test-sign.tif'
          with Image.open(p) as im:
              print(im.format, im.size, im.mode)
              im.verify()
          PY

      - name: Endpoint diagnostic complete
        run: echo "Official binary endpoint is readable."

      - name: Commit generated graphics checkpoint
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "No importable exact-row graphics remained."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/learning/signs/catalog.json \
                  content/learning/signs/audit.json \
                  content/learning/signs/sources.json \
                  content/learning/signs/graphics-import-report.json \
                  content/learning/signs/graphics
          git commit -m "Batch import remaining verified sign graphics"
          git push origin HEAD:stage4-learning-content
