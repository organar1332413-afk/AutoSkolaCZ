name: Restore preserved AutoSkolaCZ history
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild preserved Git bundle
        run: |
          cat import/b64chunk.* > history.bundle.b64
          base64 -d history.bundle.b64 > history.bundle
          git bundle verify history.bundle
      - name: Restore master and stage1 tag
        run: |
          git fetch history.bundle master:refs/remotes/import/master stage1-apk:refs/tags/stage1-apk
          test "$(git rev-parse refs/remotes/import/master)" = "2496ecf66bb7b4508c3bcfa8072e4ee99608aa8d"
          test "$(git rev-parse refs/tags/stage1-apk)" = "59b2e95508a9a09e1a88e4a7a2c3b58599cddeca"
          git push origin refs/remotes/import/master:refs/heads/master
          git push origin refs/tags/stage1-apk:refs/tags/stage1-apk
